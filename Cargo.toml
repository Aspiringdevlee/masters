[package]
name = "masterduel-secret-pack-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7"
eframe = "0.29"
global-hotkey = "0.9"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sysinfo = "0.39"

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"